<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#f97316" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="none" stroke="#334155" stroke-width="4" opacity="0.6"/>

  <!-- Store Icon Shell -->
  <g filter="url(#glow)">
    <!-- Main Store Body -->
    <path d="M96 200 L120 120 L392 120 L416 200 Z" fill="url(#grad1)"/>
    
    <!-- Awning Striping -->
    <path d="M120 120 L156 200 L188 200 L168 120 Z" fill="#ffffff" opacity="0.25"/>
    <path d="M220 120 L236 200 L276 200 L268 120 Z" fill="#ffffff" opacity="0.25"/>
    <path d="M320 120 L316 200 L356 200 L368 120 Z" fill="#ffffff" opacity="0.25"/>
    
    <!-- Store Pillars & Wall -->
    <rect x="116" y="200" width="280" height="192" rx="16" fill="#1e293b" stroke="#475569" stroke-width="6"/>

    <!-- Shop Shelves / Rack Inside -->
    <line x1="140" y1="264" x2="372" y2="264" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>
    <line x1="140" y1="328" x2="372" y2="328" stroke="#64748b" stroke-width="6" stroke-linecap="round"/>

    <!-- Boxes / Cartons on Shelves -->
    <rect x="156" y="224" width="48" height="40" rx="6" fill="#f59e0b"/>
    <rect x="216" y="216" width="56" height="48" rx="6" fill="#0ea5e9"/>
    <rect x="284" y="228" width="44" height="36" rx="6" fill="#10b981"/>

    <!-- Lower Shelf Items -->
    <rect x="156" y="284" width="68" height="44" rx="6" fill="#ec4899"/>
    <rect x="236" y="280" width="52" height="48" rx="6" fill="#8b5cf6"/>
    <rect x="300" y="288" width="60" height="40" rx="6" fill="#f97316"/>

    <!-- AI Scan Target Reticle in Center -->
    <circle cx="256" cy="272" r="76" fill="none" stroke="#38bdf8" stroke-width="5" stroke-dasharray="16 8"/>
    <circle cx="256" cy="272" r="8" fill="#38bdf8"/>
    
    <!-- Camera Badge Pin -->
    <circle cx="396" cy="380" r="48" fill="url(#grad2)"/>
    <circle cx="396" cy="380" r="22" fill="#0f172a"/>
    <circle cx="396" cy="380" r="12" fill="#38bdf8"/>
    <circle cx="414" cy="362" r="5" fill="#ffffff"/>
  </g>
</svg>
