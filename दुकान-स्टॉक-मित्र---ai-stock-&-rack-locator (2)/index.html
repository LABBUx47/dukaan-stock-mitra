    <!-- Suppress benign Vite HMR WebSocket closing warning in cloud iframe -->
    <script>
      window.addEventListener('error', function(event) {
        if (event && event.message && (event.message.indexOf('WebSocket') !== -1 || event.message.indexOf('@vite/client') !== -1)) {
          event.stopImmediatePropagation();
        }
      }, true);
      window.addEventListener('unhandledrejection', function(event) {
        if (event && event.reason && typeof event.reason.message === 'string' && event.reason.message.indexOf('WebSocket') !== -1) {
          event.stopImmediatePropagation();
        }
      }, true);
    </script>
